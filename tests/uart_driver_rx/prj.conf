CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_EMUL=y
CONFIG_RING_BUFFER=y
# Same priority order as the target: the NUS UART's work queue (MAIN_THREAD_PRIORITY 0) runs above the 20 Hz
# rate group (priority 2) that calls schedIn. The test thread plays the rate group.
CONFIG_UART_EMUL_WORK_Q_PRIORITY=0
CONFIG_ZTEST_THREAD_PRIORITY=2
